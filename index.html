<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Field Inspect</title>
<meta name="theme-color" content="#0f172a" />
<meta name="description" content="Building/pest inspection field capture app" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ JOB LIST VIEW ============ -->
<section id="view-joblist" class="view">
  <header class="topbar">
    <h1>Field Inspect</h1>
  </header>

  <main class="content">
    <div id="job-form" class="card job-form hidden">
      <input id="job-name" type="text" placeholder="Job / site name" autocomplete="off" />
      <input id="job-address" type="text" placeholder="Address (optional)" autocomplete="off" />
      <textarea id="job-notes" placeholder="Notes (optional)" rows="2"></textarea>
      <div class="row gap">
        <button id="job-form-cancel" class="btn btn-secondary flex1">Cancel</button>
        <button id="job-form-save" class="btn btn-primary flex1">Create Job</button>
      </div>
    </div>

    <ul id="job-list" class="job-list"></ul>

    <p id="job-empty" class="empty-hint hidden">No jobs yet. Tap "+ New Job" to start your first inspection.</p>
  </main>

  <button id="new-job-btn" class="fab" aria-label="New Job">+ New Job</button>
</section>

<!-- ============ JOB CAPTURE VIEW ============ -->
<section id="view-job" class="view hidden">
  <header class="topbar">
    <button id="back-btn" class="icon-btn" aria-label="Back">←</button>
    <div class="topbar-title">
      <h1 id="job-title">Job</h1>
      <span id="job-subtitle" class="subtitle"></span>
    </div>
    <button id="delete-job-btn" class="icon-btn" aria-label="Delete job">🗑</button>
  </header>

  <main class="content">
    <div class="zone-bar">
      <label for="zone-input" class="zone-label">Zone / Area</label>
      <input id="zone-input" list="zone-suggestions" type="text" placeholder="e.g. Attic, North Foundation, Kitchen…" autocomplete="off" />
      <datalist id="zone-suggestions"></datalist>
    </div>

    <div id="gallery" class="gallery"></div>
    <p id="gallery-empty" class="empty-hint">No captures yet for this job. Use the buttons below to take a photo or record a zone note.</p>
  </main>

  <div class="action-bar">
    <button id="open-camera-btn" class="action-btn">
      <span class="action-icon">📷</span>
      <span>Photo</span>
    </button>
    <button id="zone-memo-btn" class="action-btn">
      <span class="action-icon">🎙️</span>
      <span>Zone Note</span>
    </button>
  </div>
</section>

<!-- ============ CAMERA MODAL ============ -->
<section id="camera-modal" class="modal hidden">
  <div class="camera-wrap">
    <video id="camera-video" playsinline autoplay muted></video>
    <canvas id="camera-canvas" class="hidden"></canvas>
    <div class="camera-zone-pill" id="camera-zone-pill"></div>
  </div>
  <div class="camera-controls">
    <button id="camera-cancel" class="icon-btn light" aria-label="Cancel">✕</button>
    <button id="camera-shutter" aria-label="Take photo"></button>
    <button id="camera-switch" class="icon-btn light" aria-label="Switch camera">🔄</button>
  </div>
  <p id="camera-error" class="camera-error hidden"></p>
</section>

<!-- ============ RECORDING MODAL ============ -->
<section id="record-modal" class="modal hidden">
  <div class="record-wrap">
    <div class="record-dot"></div>
    <p id="record-target-label" class="record-target"></p>
    <p id="record-timer" class="record-timer">0:00</p>
    <p class="record-hint">Recording voice memo…</p>
  </div>
  <div class="record-controls">
    <button id="record-cancel" class="icon-btn light" aria-label="Cancel">✕</button>
    <button id="record-stop" class="stop-btn" aria-label="Stop recording"></button>
  </div>
</section>

<!-- ============ CAPTURE DETAIL MODAL ============ -->
<section id="detail-modal" class="modal detail-modal hidden">
  <header class="detail-header">
    <button id="detail-close" class="icon-btn light" aria-label="Close">✕</button>
    <span id="detail-zone" class="detail-zone-label"></span>
    <button id="detail-delete" class="icon-btn light" aria-label="Delete capture">🗑</button>
  </header>
  <div class="detail-body">
    <img id="detail-photo" class="detail-photo hidden" alt="Capture photo" />
    <div id="detail-audio-wrap" class="detail-audio-wrap hidden">
      <audio id="detail-audio" controls></audio>
    </div>
    <button id="detail-add-memo" class="btn btn-primary detail-add-memo hidden">🎙️ Attach Voice Note</button>
  </div>
</section>

<div id="toast" class="toast hidden"></div>

<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
